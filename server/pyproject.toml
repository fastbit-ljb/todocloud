[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todocloud-server"
version = "0.1.0"
description = "TodoCloud FastAPI server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis>=5,<7",
    "celery[redis]>=5.4,<6",
    "python-multipart>=0.0.20,<1",
    "minio>=7.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
