services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: !reset []

  server:
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://todocloud:${POSTGRES_PASSWORD}@postgres:5432/todocloud
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000

  worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://todocloud:${POSTGRES_PASSWORD}@postgres:5432/todocloud
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
