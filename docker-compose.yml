services:
  postgres:
    image: postgres:16-alpine
    container_name: todocloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todocloud
      POSTGRES_USER: todocloud
      POSTGRES_PASSWORD: change-me-in-development
    ports:
      - "5432:5432"
    volumes:
      - todocloud-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: todocloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - todocloud-redis:/data

  minio:
    image: minio/minio:latest
    container_name: todocloud-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: todocloud
      MINIO_ROOT_PASSWORD: change-me-in-development
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - todocloud-minio:/data

  server:
    build:
      context: ./server
    container_name: todocloud-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://todocloud:change-me-in-development@postgres:5432/todocloud
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./server
    container_name: todocloud-worker
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://todocloud:change-me-in-development@postgres:5432/todocloud
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  todocloud-postgres:
  todocloud-redis:
  todocloud-minio:
